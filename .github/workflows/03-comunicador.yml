
name: Comunicador de la region

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "que villano envia el mensaje?"
        required: true
        type: choice
        options:
          - "Joker"
          - "Lex Luthor"
          - "Darth Vader"

      mensaje:
        description: "mensaje para el consejo?"
        required: true
        default: "la mision fue un exito"

      prioridad:
        description: "nivel de prioridad?"
        required: true
        type: choice
        options:
          - "normal"
          - "alta"
          - "crítica"


jobs:
  tramitir-mensajes:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "inputs"
          echo ""
          echo "El villano es: ${{ inputs.villano }}"
          echo "El nivel: ${{ inputs.prioridad }}"
          echo "el mensaje: ${{ inputs.mensaje }}"
          
      
  

  