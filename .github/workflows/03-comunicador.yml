
name: Comunicador de la region

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "que villano envia el mensaje?"
        required: true
        type: choice
        options:
          - "Joker"
          - "Lex Luthor"
          - "Darth Vader"

      mensaje:
        description: "mensaje para el consejo?"
        required: true
        default: "la mision fue un exito"

      prioridad:
        description: "nivel de prioridad?"
        required: true
        type: choice
        options:
          - "normal"
          - "alta"
          - "crítica"


jobs:
  tramitir-mensajes:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la legion
        run: sudo apt-get install -y cowsay



      - name: Imprimir inputs
        run: |
          echo "inputs"
          echo "==============================="
          echo "   Transmison interceptada"
          echo "==============================="
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "fecha : $(date -u + %d-%m-%Y)"
          echo "------Mensaje------"
          cowsay -f eyes "${{ inputs.mensaje }}"
          echo ""
          echo "----${{ inputs.villano }}----"
          echo "...."

          
          
      
  

  